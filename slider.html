<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .mySlides {
            margin: auto;
            padding: 10px;
            background-color: aquamarine;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Slider in CSS</h1>
    <section>
        <img class="mySlides" src="1.jpg" alt="Beach" style="height: 300px;">
        <img class="mySlides" src="2.jpg" alt="Beach" style="height: 300px;">
        <img class="mySlides" src="3.jpg" alt="Sand" style="height: 300px;">
        <img class="mySlides" src="4.jpg" alt="Sand" style="height: 300px;">
    </section>

    <script>
        var myIndex = 0;
        carousel()

        function carousel() {
            var i;
            var x = document.getElementsByClassName("mySlides");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }

            myIndex++;
            if (myIndex > x.length) {
                myIndex = 1
            }
            x[myIndex - 1].style.display = "block";
            setTimeout(carousel, 3000);
        }
    </script>
</body>

</html>
